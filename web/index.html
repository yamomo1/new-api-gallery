<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- 品牌兜底：正式标题/描述/OG/JSON-LD 由服务端 service/seo 按路径注入。
         这里的静态值只在本地 dev 与注入失效时生效，避免标签页先闪成占位名。 -->
    <title>一幕AI</title>
    <meta name="title" content="一幕AI" />

    <meta name="theme-color" content="#030b0f" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'dark' // 默认深色模式，与 ThemeProvider 的 DEFAULT_THEME 保持一致
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'dark'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = 'dark'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
