# New API 二开 · 1Panel 专用编排文件
#
# 用法:1Panel → 容器 → 编排 → 创建编排,把本文件内容粘贴进编排编辑框。
# 注意:1Panel 编排【不执行 build】,所以先把镜像 build 出来(见 DEPLOY-1Panel.md 第 1 步):
#       docker build -t new-api-gallery:latest .
# 下面 image 指向的就是这个已构建的本地镜像(含画廊/首页/主题二开代码)。
#
# 口令:把 <PG_PASS> / <REDIS_PASS> / <SESSION_SECRET> / <CRYPT_KEY> 替换为你生成的强口令
#       (在 1Panel「终端」里跑:  openssl rand -hex 16 / openssl rand -hex 32)。
#       也可改为 env_file 引用一个 .env(见 DEPLOY-1Panel.md)。

services:
  new-api:
    image: new-api-gallery:latest
    container_name: new-api-gallery
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:<PG_PASS>@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:<REDIS_PASS>@redis:6379
      - SESSION_SECRET=<SESSION_SECRET>
      - CRYPT_KEY=<CRYPT_KEY>
      - TZ=Asia/Shanghai
      - PORT=3000
      - ERROR_LOG_ENABLED=true
      - DEFAULT_LANGUAGE=zh-CN
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7
    container_name: new-api-gallery-redis
    restart: always
    command: ["redis-server", "--requirepass", "<REDIS_PASS>"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: new-api-gallery-pg
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "<PG_PASS>"
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network

volumes:
  pg_data:

networks:
  new-api-network:
    driver: bridge
